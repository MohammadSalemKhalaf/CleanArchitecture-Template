# Production stack for a single Docker host. Copied to the server by .github/workflows/deploy.yml.
#
# Expects, next to this file on the server:
#   .env         Application settings and secrets, maintained on the server (see deploy/server.env.example).
#   release.env  Written by deploy.sh: API_IMAGE=<registry>/<name>:<tag> of the release being run.
#
# The database is external (managed SQL Server or a dedicated host): its connection string lives in .env.

# The project name comes from the directory (or COMPOSE_PROJECT_NAME); Compose sanitises it.

x-api: &api
  image: ${API_IMAGE:?API_IMAGE is set by deploy.sh}
  env_file: .env
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  migrator:
    <<: *api
    command: ["--migrate"]
    restart: "no"
    profiles: ["migrate"]  # Never started by "up"; deploy.sh runs it explicitly before the API.

  api:
    <<: *api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Redis: redis:6379,abortConnect=false,connectTimeout=2000,syncTimeout=1000,asyncTimeout=1000
    ports:
      # Bound to loopback: put a TLS-terminating reverse proxy (Caddy, nginx, Traefik) in front.
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
