name: Deploy

# Called by release.yml after a successful publish, or run by hand to redeploy or roll back to any
# previously published tag (Actions > Deploy > Run workflow > image-tag = sha-<commit>).
on:
  workflow_call:
    inputs:
      image-tag:
        type: string
        required: true
      environment:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      image-tag:
        description: Image tag to deploy, for example sha-<full commit SHA>
        type: string
        required: true
      environment:
        description: GitHub environment holding the deployment secrets
        type: string
        default: production

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Environment protection rules (required reviewers, branch restrictions) apply here.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.PUBLIC_URL }}
    env:
      IMAGE_TAG: ${{ inputs.image-tag }}
      REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME || github.repository }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy

      - name: Validate inputs
        run: |
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_.-]{1,128}$ ]] || { echo "Invalid image tag." >&2; exit 1; }
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9_./-]+$ ]] || { echo "Set the DEPLOY_PATH variable to an absolute path." >&2; exit 1; }
          [[ -n "$DEPLOY_HOST" && -n "$DEPLOY_USER" ]] || { echo "Set the DEPLOY_HOST and DEPLOY_USER secrets." >&2; exit 1; }
          echo "IMAGE=${REGISTRY,,}/${IMAGE_NAME,,}:${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host keys: never trust on first use from CI.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "SSH=ssh -i $HOME/.ssh/deploy_key -p $DEPLOY_PORT -o BatchMode=yes $DEPLOY_USER@$DEPLOY_HOST" >> "$GITHUB_ENV"
          echo "SCP=scp -i $HOME/.ssh/deploy_key -P $DEPLOY_PORT -o BatchMode=yes" >> "$GITHUB_ENV"

      - name: Upload deployment files
        run: |
          $SSH "mkdir -p '$DEPLOY_PATH'"
          $SCP deploy/docker-compose.prod.yml deploy/deploy.sh deploy/rollback.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          $SSH "chmod +x '$DEPLOY_PATH/deploy.sh' '$DEPLOY_PATH/rollback.sh'"

      - name: Log the server in to the registry
        env:
          PULL_USERNAME: ${{ secrets.REGISTRY_PULL_USERNAME }}
          PULL_TOKEN: ${{ secrets.REGISTRY_PULL_TOKEN }}
        run: |
          [[ -n "$PULL_USERNAME" && -n "$PULL_TOKEN" ]] || { echo "Set REGISTRY_PULL_USERNAME and REGISTRY_PULL_TOKEN." >&2; exit 1; }
          # The token travels over stdin, so it never appears in a process list or shell history.
          printf '%s' "$PULL_TOKEN" | $SSH "docker login '${REGISTRY,,}' --username '$PULL_USERNAME' --password-stdin"

      - name: Deploy
        run: $SSH "'$DEPLOY_PATH/deploy.sh' '$IMAGE'"

      - name: Verify public health endpoint
        if: vars.PUBLIC_URL != ''
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          for attempt in $(seq 1 10); do
            curl --fail --silent --show-error "$PUBLIC_URL/health/ready" && exit 0
            sleep 6
          done
          echo "Public health check failed. Roll back with: Actions > Deploy > Run workflow (previous image tag)." >&2
          exit 1
