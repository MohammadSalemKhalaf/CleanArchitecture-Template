# Local environment: API + one-off migrator + SQL Server + Redis + Seq.
# Usage: cp .env.example .env  (then set the placeholders)  &&  docker compose up --build -d

# The project name comes from the directory (or COMPOSE_PROJECT_NAME); Compose sanitises it.

x-database-connection: &database-connection
  ConnectionStrings__Database: Server=db,1433;Database=${DB_NAME:-TemplateApp};User Id=sa;Password=${DB_SA_PASSWORD:?Set DB_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True

x-seq-logging: &seq-logging
  Serilog__WriteTo__Seq__Name: Seq
  Serilog__WriteTo__Seq__Args__serverUrl: http://seq:5341

services:
  api:
    image: ${API_IMAGE:-templateapp-api:local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: [*database-connection, *seq-logging]
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Redis: redis:6379,abortConnect=false,connectTimeout=2000,syncTimeout=1000,asyncTimeout=1000
      Authentication__Schemes__Bearer__ValidIssuer: ${JWT_ISSUER:?Set JWT_ISSUER in .env}
      Authentication__Schemes__Bearer__ValidAudiences__0: ${JWT_AUDIENCE:?Set JWT_AUDIENCE in .env}
      Authentication__Schemes__Bearer__SigningKeys__0__Issuer: ${JWT_ISSUER}
      Authentication__Schemes__Bearer__SigningKeys__0__Value: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      seq:
        condition: service_started
    healthcheck:
      # The runtime image has no curl; bash's /dev/tcp is enough for an HTTP/1.0 probe.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  migrator:
    # Same image as the API (built by the api service); runs migrations and exits.
    image: ${API_IMAGE:-templateapp-api:local}
    pull_policy: never
    command: ["--migrate"]
    environment:
      <<: [*database-connection, *seq-logging]
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD:?Set DB_SA_PASSWORD in .env}
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    # Cache only: no persistence. Losing it costs a cache warm-up, never data.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  seq:
    image: datalust/seq:2026.1
    environment:
      ACCEPT_EULA: "Y"
      # Local only. Configure an admin password (SEQ_FIRSTRUN_ADMINPASSWORD) for any shared instance.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "${SEQ_UI_PORT:-8081}:80"
      - "${SEQ_INGESTION_PORT:-5341}:5341"
    volumes:
      - seq-data:/data
    restart: unless-stopped

volumes:
  db-data:
  seq-data:
